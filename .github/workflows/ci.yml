name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://naryadai:naryadai@127.0.0.1:15432/naryadai
      REDIS_URL: redis://127.0.0.1:16379
      ACCESS_TOKEN_SECRET: ci-only-secret-at-least-32-characters-long
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: naryadai-test
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_FORCE_PATH_STYLE: "true"
      SEED_ADMIN_LOGIN: admin
      SEED_ADMIN_PIN: "1234"
      AI_MODE: mock
      AI_TEXT_PROVIDER: off
      AI_VISION_PROVIDER: off
      AI_AUDIO_PROVIDER: off
      PUSH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test and lint dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Start PostgreSQL, Redis and local S3
        run: docker compose up -d --wait postgres redis s3
      - name: Apply schema and seed test users
        run: |
          python -m scripts.migrate
          python -m scripts.seed
      - name: Check Python source
        run: ruff check app tests
      - name: Check formatting
        run: ruff format --check app tests
      - name: Check types
        run: python -m mypy app
      - name: Check whitespace
        run: git diff --check
      - name: Run full suite with branch coverage
        run: >-
          pytest -q -W error::DeprecationWarning --cov=app --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
      - name: Build package
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist/
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: ignore
      - name: Show service logs if a check failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
