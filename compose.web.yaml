# Web + tunnel overlay. Base services stay in docker-compose.yml.
# Usage:
#   docker compose -f docker-compose.yml -f compose.web.yaml -f compose.tunnel.yaml up -d --build
services:
  web:
    image: caddy:2-alpine
    volumes:
      - ../NaryadAI-frontend/dist:/srv/web:ro
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped

  worker:
    build: .
    env_file: ${APP_ENV_FILE:-.env}
    command: python -m app.services.background
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://naryadai:naryadai@postgres:5432/naryadai}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
