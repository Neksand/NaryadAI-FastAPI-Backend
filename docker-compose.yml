services:
  api:
    build: .
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://naryadai:naryadai@postgres:5432/naryadai}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${COMPOSE_S3_ENDPOINT:-http://s3:9000}
      S3_FORCE_PATH_STYLE: "true"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    # Keep the host API's local model process separate from PostgreSQL that may
    # already be running on the laptop's default port.
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naryadai}
      POSTGRES_USER: ${POSTGRES_USER:-naryadai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naryadai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naryadai -d naryadai"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  s3:
    build:
      context: .
      dockerfile: Dockerfile.s3
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/moto-api/')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
